[package]
name = "json-syntax"
version = "0.13.0"
edition = "2021"
authors = ["Timothée Haudebourg <author@haudebourg.net>"]
description = "Strict JSON parsing and mapping library"
categories = ["parsing", "data-structures"]
keywords = ["parsing", "json", "rfc", "mapping"]
repository = "https://github.com/timothee-haudebourg/json-syntax"
documentation = "https://docs.rs/json-syntax"
license = "MIT/Apache-2.0"
readme = "README.md"
rust-version = "1.85.0"

[features]
default = ["simdutf8"]

## JSON Canonicalization Scheme (JCS) implementation.
canonicalize = ["ryu-js"]

## Serialization/Deserialization support using `serde`.
serde = ["dep:serde", "smallstr/serde"]

## Compatibility layer with the `serde_json` crate.
serde_json = ["dep:serde_json"]

## Compatibility layer with the `sonic-rs` crate.
sonic-rs = ["dep:sonic-rs"]

## SIMD-accelerated UTF-8 validation in the slice parser.
simdutf8 = ["dep:simdutf8"]

[package.metadata.docs.rs]
all-features = true

[lib]
bench = false

[dependencies]
contextual = { version = "0.1.6", optional = true }
decoded-char = "0.1.1"
hashbrown = "0.17.0"
json-escape-simd = "3.0.2"
lexical = { version = "7.0.5", features = ["format"] }
locspan = "0.8.2"
locspan-derive = "0.6.0"
memchr = "2.8.0"
ryu-js = { version = "1.0.2", optional = true }
serde = { version = "1.0.228", optional = true }
serde_json = { version = "1.0.149", optional = true }
simdutf8 = { version = "0.1.5", optional = true }
smallstr = "0.3.1"
smallvec = "1.15.1"
sonic-rs = { version = "0.5.8", optional = true }
utf8-decode = "2.0.0"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
ryu-js = "1.0.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[[example]]
name = "serde"
required-features = ["serde"]

[[example]]
name = "serde_json"
required-features = ["serde_json"]

[[example]]
name = "sonic_rs"
required-features = ["sonic-rs"]

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "print"
harness = false

[[bench]]
name = "access"
harness = false

[[bench]]
name = "object"
harness = false

[[bench]]
name = "serde"
harness = false
required-features = ["serde"]

[[bench]]
name = "convert"
harness = false
required-features = ["serde_json"]

[[bench]]
name = "canonicalize"
harness = false
required-features = ["canonicalize"]

[[bench]]
name = "numbers"
harness = false

[[bench]]
name = "strings"
harness = false

[[bench]]
name = "macros"
harness = false

[[bench]]
name = "end_to_end"
harness = false
