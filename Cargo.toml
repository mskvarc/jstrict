[package]
name = "jstrict"
description = "Strict RFC 8259 / ECMA-404 JSON parser with source code mapping"
version = "0.15.0"
edition = "2024"
rust-version = "1.96.0"
authors = [
    "Timothée Haudebourg <author@haudebourg.net>",
    "Matej Škvarč <matej.skvarc@senlab.io>",
]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/mskvarc/jstrict/"
documentation = "https://docs.rs/jstrict"
keywords = ["json", "parser", "rfc8259", "canonicalize", "simd"]
categories = ["parser-implementations", "encoding", "data-structures"]
autobenches = false
exclude = ["/.github"]

[features]
default = ["simdutf8"]
# JSON Canonicalization Scheme (RFC 8785).
canonicalize = ["dep:ryu-js"]
# `contextual::WithContext` printing adapters.
contextual = ["dep:contextual"]
# `Serialize` / `Deserialize` for `Value`, `Object`, `Number`.
serde = ["dep:serde", "compact_str/serde"]
# Conversion from/to `serde_json::Value`.
serde_json = ["dep:serde_json"]
# SIMD-accelerated UTF-8 validation in the slice parser.
simdutf8 = ["dep:simdutf8"]
# Conversion from/to `sonic_rs::Value`.
sonic-rs = ["dep:sonic-rs"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
bench = false

[dependencies]
compact_str = "0.10.0"
contextual = { version = "0.1.6", optional = true }
decoded-char = "0.1.1"
hashbrown = "0.17.1"
json-escape-simd = "3.1.1"
lexical = { version = "7.0.5", features = ["format"] }
locspan = "1.0.0"
memchr = "2.8.3"
ryu-js = { version = "1.0.3", optional = true }
serde = { version = "1.0.229", optional = true }
serde_json = { version = "1.0.151", optional = true }
simdutf8 = { version = "0.1.5", optional = true }
smallvec = "1.15.2"
sonic-rs = { version = "0.5.8", optional = true }
utf8-decode = "2.0.0"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
ryu-js = "1.0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[lints.clippy]
wildcard_dependencies = "warn"
wildcard_imports = "warn"
used_underscore_binding = "warn"
missing_const_for_fn = "warn"
cloned_instead_of_copied = "warn"
unnecessary_self_imports = "warn"
redundant_clone = "warn"
needless_collect = "warn"
map_unwrap_or = "warn"

[[example]]
name = "serde"
required-features = ["serde"]

[[example]]
name = "serde_json"
required-features = ["serde_json"]

[[example]]
name = "sonic_rs"
required-features = ["sonic-rs"]

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "print"
harness = false

[[bench]]
name = "access"
harness = false

[[bench]]
name = "object"
harness = false

[[bench]]
name = "serde"
harness = false
required-features = ["serde"]

[[bench]]
name = "convert"
harness = false
required-features = ["serde_json"]

[[bench]]
name = "canonicalize"
harness = false
required-features = ["canonicalize"]

[[bench]]
name = "numbers"
harness = false

[[bench]]
name = "strings"
harness = false

[[bench]]
name = "macros"
harness = false

[[bench]]
name = "end_to_end"
harness = false
